name: event-driven-order-platform

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orders -d orders']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    security_opt: ['no-new-privileges:true']

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health --exit-when-healthy']
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - '127.0.0.1:19092:19092'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [edge, backend]
    security_opt: ['no-new-privileges:true']

  platform:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      ROLE: all
      PORT: 8080
      DATABASE_URL: postgres://orders:local-demo-only@postgres:5432/orders
      KAFKA_BROKERS: redpanda:9092
      OUTBOX_POLL_MS: 250
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:8080:8080'
    networks: [edge, backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 20s

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres-data:
  redpanda-data:
