name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-order-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run formatting, lint, types, tests, and build
        run: npm run check
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine hadolint - < Dockerfile
      - name: Scan repository
        run: >-
          docker run --rm -v "$PWD:/workspace" aquasec/trivy:0.72.0
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL
          --exit-code 1 --no-progress /workspace

  compose-smoke:
    name: Event-driven Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24.18.0
      - name: Build and start the platform
        run: docker compose up --build --detach --wait
      - name: Verify idempotency and saga completion
        run: node scripts/smoke.mjs
      - name: Capture diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the platform
        if: always()
        run: docker compose down --volumes --remove-orphans
